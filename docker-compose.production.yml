# ===========================================================================
# docker-compose.production.yml
# India Legislative Intelligence — Multi-Container SaaS Architecture
# ===========================================================================

version: "3.8"

services:
  # 1. Next.js Web Client
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://api:8000
        NEXT_PUBLIC_APP_ENV: production
    container_name: legis_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - legis_net

  # 2. FastAPI Backend Service
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: legis_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-legis_admin}:${POSTGRES_PASSWORD:-legis_secret}@postgres:5432/${POSTGRES_DB:-legislative_intel}
      - REDIS_URL=redis://redis:6379/0
      - FRONTEND_URL=http://localhost:3000
      - API_CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - RATE_LIMIT_ENABLED=true
      - LEGISLATIVE_MONITOR_ENABLED=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - legis_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # 3. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: legis_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-legis_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-legis_secret}
      POSTGRES_DB: ${POSTGRES_DB:-legislative_intel}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - legis_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-legis_admin} -d ${POSTGRES_DB:-legislative_intel}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 4. Redis In-Memory Cache & Distributed Lock
  redis:
    image: redis:7-alpine
    container_name: legis_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - legis_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 5. Background Worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: legis_worker
    restart: unless-stopped
    environment:
      - ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-legis_admin}:${POSTGRES_PASSWORD:-legis_secret}@postgres:5432/${POSTGRES_DB:-legislative_intel}
      - REDIS_URL=redis://redis:6379/0
      - JOB_EXECUTION_MODE=worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - legis_net

  # 6. Background Scheduler
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.scheduler
    container_name: legis_scheduler
    restart: unless-stopped
    environment:
      - ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-legis_admin}:${POSTGRES_PASSWORD:-legis_secret}@postgres:5432/${POSTGRES_DB:-legislative_intel}
      - REDIS_URL=redis://redis:6379/0
      - JOB_EXECUTION_MODE=scheduler
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - legis_net

volumes:
  pgdata:
  redisdata:

networks:
  legis_net:
    driver: bridge
